<!doctype html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>All In</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b12;--s1:#111725;--s2:#1a2234;--ln:#2b3552;--tx:#eef2fb;--mu:#8e99b3;--a:#29c5ff;--on:#06080d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eceff6;--s1:#fff;--s2:#eef1f8;--ln:#d3d9e9;--tx:#0b1020;--mu:#586280;color-scheme:light}}
:root[data-theme="light"]{--bg:#eceff6;--s1:#fff;--s2:#eef1f8;--ln:#d3d9e9;--tx:#0b1020;--mu:#586280;color-scheme:light}
body[data-tab=today]{--a:#29c5ff}body[data-tab=fuel]{--a:#19e0b0}body[data-tab=train]{--a:#7b88ff}body[data-tab=stacks]{--a:#ffa51f}body[data-tab=dose]{--a:#bd78ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.35 'Plus Jakarta Sans',system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg)}
.logo{font:800 italic 30px/1 'Barlow Condensed';letter-spacing:.5px}.logo span{color:var(--a);margin-left:3px}
.chip{background:var(--s1);border:1px solid var(--ln);color:var(--tx);border-radius:99px;padding:7px 13px;font:600 13px 'Plus Jakarta Sans'}
main{padding:4px 14px 100px;max-width:560px;margin:auto}
.card{position:relative;background:var(--s1);padding:14px 14px 14px 18px;margin:0 0 12px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--a))}
h2{font:800 italic 23px/1 'Barlow Condensed';margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font:600 13px 'Plus Jakarta Sans';color:var(--mu);font-style:normal}
.num{font:800 italic 40px/1 'Barlow Condensed'}.mu{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;align-items:center}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.hero{display:flex;gap:16px;align-items:center;background:var(--s1) repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.025) 22px 44px)}
.ring{position:relative;width:132px;flex:none;aspect-ratio:1}.ring svg{transform:rotate(-90deg);width:100%}
.rb,.rf{fill:none;stroke-width:12}.rb{stroke:var(--s2)}.rf{transition:stroke-dashoffset .7s}
.ring>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font:800 italic 34px/1 'Barlow Condensed'}.ring small{color:var(--mu);font-size:12px}
.mac{flex:1;display:grid;gap:10px}.mac div div{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar{height:8px;background:var(--s2);transform:skewX(-20deg);overflow:hidden}.bar i{display:block;height:100%;transition:width .5s}
.next{background:var(--c);color:var(--on)}.next::before{display:none}.next h2{margin:0 0 2px;font-size:26px}.next p{margin:0 0 12px;font-weight:600;opacity:.8}
button{font:inherit;cursor:pointer}
.btn{background:var(--a);color:var(--on);border:0;padding:13px 18px;font:800 italic 19px/1 'Barlow Condensed';letter-spacing:.3px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);width:100%}
.btn.sm{width:auto;padding:11px 20px;font-size:17px}.next .btn{background:var(--on);color:var(--tx)}
.btn.ghost{background:var(--s2);color:var(--tx)}
.q{background:var(--s2);color:var(--tx);border:1px solid var(--ln);padding:11px 4px;font-weight:700;border-radius:10px;flex:1}
.q:active,.btn:active{transform:scale(.97)}
input,select{width:100%;background:var(--s2);color:var(--tx);border:0;border-bottom:2px solid var(--ln);border-radius:8px 8px 0 0;padding:11px 10px;font:600 16px 'Plus Jakarta Sans';min-width:0}
input:focus,select:focus{outline:0;border-bottom-color:var(--a)}
label{display:block;font-size:12px;color:var(--mu);font-weight:600;margin:0 0 4px}
.f{margin-bottom:10px}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.pill{flex:none;background:var(--s2);color:var(--tx);border:1px solid var(--ln);border-radius:99px;padding:9px 14px;font-weight:700;font-size:14px}
.pill.on{background:var(--a);color:var(--on);border-color:var(--a)}
.step{display:flex;align-items:center;background:var(--s2);border-radius:10px;overflow:hidden}
.step button{width:42px;height:46px;border:0;background:none;color:var(--a);font:800 24px 'Barlow Condensed'}
.step b{flex:1;text-align:center;font:800 italic 26px 'Barlow Condensed'}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}.li:first-of-type{border-top:0}
.li>div{flex:1;min-width:0}.li b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{background:none;border:0;color:var(--mu);font-size:20px;padding:6px 10px}
.add{background:var(--a);color:var(--on);border:0;border-radius:8px;padding:9px 16px;font:800 italic 17px 'Barlow Condensed'}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;color:var(--mu)}
.wk i{display:block;height:34px;margin-top:4px;background:var(--s2);border-radius:6px;position:relative;overflow:hidden}
.wk i.f1::after{content:"";position:absolute;inset:0;background:var(--a);opacity:.45}.wk i.f2::before{content:"";position:absolute;left:0;right:0;bottom:0;height:45%;background:#7b88ff}
.syr{height:26px;background:var(--s2);border:2px solid var(--ln);position:relative;margin:10px 0 4px;background-image:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),var(--ln) calc(10% - 1px) 10%)}
.syr i{position:absolute;left:0;top:0;bottom:0;background:var(--a);opacity:.9}
.warn{color:#ff6b78;font-weight:700;font-size:13px;margin-top:6px}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--s1);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav a{color:var(--mu);text-decoration:none;text-align:center;padding:9px 0 8px;font-size:11px;font-weight:700;position:relative}
nav svg{width:24px;height:24px;display:block;margin:0 auto 2px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav a.on{color:var(--tx)}nav a.on svg{stroke:var(--a)}nav a.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--a);transform:skewX(-30deg)}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end}.sh[hidden]{display:none}
.sh>div{background:var(--s1);width:100%;max-height:85%;overflow:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;max-width:560px;margin:auto}
textarea{width:100%;height:80px;background:var(--s2);color:var(--tx);border:0;border-radius:8px;padding:8px;font:12px monospace}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:30;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const $=s=>document.querySelector(s),K='allin.v2';
const SITES=['Belly – lower left','Belly – lower right','Belly – upper left','Belly – upper right','Love handle – left','Love handle – right','Thigh – left','Thigh – right'];
const EX=[
 {n:'Overhead ball slams',g:'Ball',load:8,cue:'Drive through the lats and brace hard at the bottom of every slam.'},
 {n:'Rotational ball throws',g:'Ball',load:8,cue:'Rotate from the hips, not the arms. Explode through the throw.'},
 {n:'Ball squat to press',g:'Ball',load:8,cue:'Triple extension: ankles, knees, hips, then press.'},
 {n:'Spin HR intervals',g:'Spin',time:1,cue:'Reps = minutes per round. Hold your target heart rate.'},
 {n:'V-taper band pulls',g:'Bands',load:10,cue:'Pull wide, squeeze the lats, pause one second.'},
 {n:'Weighted rows',g:'Weights',load:20,cue:'Flat back. Elbow to hip.'},
 {n:'Core and plyo circuit',g:'Core',load:6,cue:'Crisp reps. Stop when form fades.'}];
const DEF={t:{kcal:1900,p:180,c:140,f:65,fi:32,w:3250},name:'Dan',wt:229,food:[],train:[],dose:[],favs:[],syncUrl:'',lastSync:0,
 stacks:[{id:'s1',n:'Dan’s morning stack',cat:'Morning',t:'07:30',k:50,p:12.6,c:0,f:0,w:750,items:[
  {d:'750ml filtered water',k:0,p:0,c:0,f:0,fi:0,w:750,mi:{Ca:22.5,Mg:7.5,Na:15},am:{}},
  {d:'1 packet Organika electrolytes',k:0,p:0,c:0,f:0,fi:0,w:0,mi:{C:60,B6:0.2,B12:0.5,Ca:45,Mg:60,Zn:0.3,Ka:200,Na:440},am:{}},
  {d:'5g creatine monohydrate',k:0,p:0,c:0,f:0,fi:0,w:0,mi:{},am:{}},
  {d:'1 tbsp bovine collagen (14g)',k:50,p:12.6,c:0,f:0,fi:0,w:0,mi:{Ca:4.2,Fe:0.1,Se:0.3,Ka:1.4,Na:9.8},am:{his:0.1,ile:0.2,leu:0.4,lys:0.5,met:0.1,phe:0.3,thr:0.3,trp:0,val:0.3}}
 ]},{id:'s2',n:'Semax protocol stack',cat:'Morning',t:'07:30',k:0,p:0,c:0,f:0,w:0}],
 vial:{name:'Retatrutide',mg:10,bac:2,dose:3,unit:'mg',syr:100},weekly:{name:'Retatrutide',days:7}};
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=Object.assign({},DEF,S||{});
const TM={},dbn=(k,f,ms)=>{clearTimeout(TM[k]);TM[k]=setTimeout(f,ms||900)};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){};if(S.syncUrl)dbn('cloud_push',()=>pushCloud(true),1800)};
let D={ex:0,sets:4,reps:12,rpe:7.5,load:8},SC='Morning',tab='today';
const day=t=>new Date(t).toLocaleDateString('en-CA'),isT=e=>day(e.ts)===day(Date.now()),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const hm=t=>new Date(t).toLocaleTimeString('en-CA',{hour:'2-digit',minute:'2-digit',hour12:false});
const r1=n=>Math.round(n*10)/10,pct=(a,b)=>Math.min(100,Math.round(a/b*100)||0),val=id=>$('#'+id).value,num=id=>+val(id)||0;
const ago=t=>{const h=(Date.now()-t)/36e5;return h<24?Math.round(h)+'h ago':Math.floor(h/24)+'d ago'};
function toast(m){const e=$('#ts');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600)}
const tot=()=>{const r={k:0,p:0,c:0,f:0,fi:0,w:0};S.food.filter(isT).forEach(e=>{for(const x in r)r[x]+=+e[x]||0});return r};
const burn=()=>Math.round(S.train.filter(isT).reduce((a,e)=>a+e.k,0));
const bar=(v,m,c)=>`<div class="bar"><i style="width:${pct(v,m)}%;background:${c}"></i></div>`;
function ring(v,m,c,big,small,sz){const C=2*Math.PI*54;return `<div class="ring" ${sz?`style="width:${sz}px"`:''}><svg viewBox="0 0 128 128"><circle cx="64" cy="64" r="54" class="rb"/><circle cx="64" cy="64" r="54" class="rf" stroke="${c}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(1,v/m))}"/></svg><div><b>${big}</b><small>${small}</small></div></div>`}
function readiness(){let f=0;S.train.forEach(e=>{const h=(Date.now()-e.ts)/36e5;if(h<24)f+=e.s*e.rpe*.8;else if(h<48)f+=e.s*e.rpe*.4});return Math.max(0,Math.round(100-f))}
function fast(){const l=S.food.filter(e=>e.k>0||e.p>0).sort((a,b)=>b.ts-a.ts)[0];return l?(Date.now()-l.ts)/36e5:null}
const lastDose=()=>S.dose.filter(d=>d.n===S.weekly.name).sort((a,b)=>b.ts-a.ts)[0];
const nextSite=()=>{const l=[...S.dose].sort((a,b)=>b.ts-a.ts)[0];return SITES[l?(SITES.indexOf(l.site)+1)%SITES.length:0]};
function next(){
 const t=tot(),d=new Date(),h=d.getHours()+d.getMinutes()/60,pace=Math.min(1,Math.max(0,(h-7)/14)),ld=lastDose();
 if(ld&&S.weekly.days>0&&(Date.now()-ld.ts)/864e5>=S.weekly.days)return{c:'#bd78ff',t:`${ld.n} dose due`,s:`Last logged ${ago(ld.ts)}`,b:'Open dose',a:"go('dose')"};
 const per=h<11?'Morning':h<16?'Afternoon':'Evening',st=S.stacks.find(x=>x.cat==per&&!S.food.some(e=>isT(e)&&e.n==x.n));
 if(st)return{c:'#ffa51f',t:`${st.n} is up`,s:`${st.k} kcal · ${st.p}g protein · ${st.w}ml`,b:'Log stack',a:`logStack('${st.id}')`};
 if(t.p<S.t.p*pace*.8)return{c:'#19e0b0',t:`${Math.round(S.t.p-t.p)}g protein to go`,s:'You’re behind pace for this time of day.',b:'Log food',a:"go('fuel')"};
 if(t.w<S.t.w*pace*.8)return{c:'#29c5ff',t:'Drink up',s:`${S.t.w-t.w}ml left today.`,b:'+500ml',a:'water(500)'};
 if(!S.train.some(isT)&&readiness()>=70)return{c:'#7b88ff',t:'Ready to train',s:`Readiness ${readiness()}%. No session logged yet.`,b:'Start session',a:"go('train')"};
 return{c:'#29c5ff',t:'On track',s:'Nothing urgent. Keep going.',b:'Log food',a:"go('fuel')"}}
const V={
today(){const t=tot(),n=next(),h=fast(),r=readiness(),wk=[...Array(7)].map((_,i)=>{const dt=Date.now()-(6-i)*864e5,k=day(dt);return `<div>${new Date(dt).toLocaleDateString('en-CA',{weekday:'narrow'})}<i class="${S.food.some(e=>day(e.ts)==k)?'f1':''} ${S.train.some(e=>day(e.ts)==k)?'f2':''}"></i></div>`}).join('');
 const m=(l,v,x,c)=>`<div><div><span>${l}</span><b>${Math.round(v)}<span class="mu">/${x}g</span></b></div>${bar(v,x,c)}</div>`;
 return `<div class="card hero" style="--c:var(--a)">${ring(t.k,S.t.kcal,'#29c5ff',Math.max(0,S.t.kcal-Math.round(t.k)),'kcal left')}<div class="mac">${m('Protein',t.p,S.t.p,'#19e0b0')}${m('Carbs',t.c,S.t.c,'#ffa51f')}${m('Fat',t.f,S.t.f,'#bd78ff')}</div></div>
 <div class="card next" style="--c:${n.c}"><h2>${n.t}</h2><p>${n.s}</p><button class="btn" onclick="${n.a}">${n.b}</button></div>
 <div class="card" style="--c:#29c5ff"><h2>Hydration <small>${t.w} / ${S.t.w} ml</small></h2>${bar(t.w,S.t.w,'#29c5ff')}<div class="row" style="margin-top:12px"><button class="q" onclick="water(250)">+250</button><button class="q" onclick="water(500)">+500</button><button class="q" onclick="water(750)">+750</button></div></div>
 <div class="g2"><div class="card" style="--c:#7b88ff;margin:0 0 12px"><h2>Readiness</h2><div class="num">${r}%</div><div class="mu">Burned today ${burn()} kcal</div></div>
 <div class="card" style="--c:#19e0b0;margin:0 0 12px"><h2>Fasting</h2><div class="num">${h==null?'–':r1(h)+'h'}</div><div class="mu">${h==null?'No meals logged':h>=12?'Autophagy window':h>=4?'Balanced':'Fed, anabolic'}</div></div></div>
 <div class="card"><h2>Last 7 days <small>food · training</small></h2><div class="wk">${wk}</div></div>`},
fuel(){const t=tot(),L=S.food.filter(isT).sort((a,b)=>b.ts-a.ts),seen={},rec=[...S.food].sort((a,b)=>b.ts-a.ts).filter(e=>e.n!='Water'&&!seen[e.n]&&(seen[e.n]=1)).slice(0,8);
 const f=(id,l)=>`<div><label>${l}</label><input id="${id}" type="number" inputmode="decimal" placeholder="0"></div>`;
 return `<div class="card"><h2>Left today <small>${Math.max(0,S.t.kcal-Math.round(t.k))} kcal</small></h2><div class="g3 mu"><div><b style="color:var(--tx)">${Math.max(0,Math.round(S.t.p-t.p))}g</b> protein</div><div><b style="color:var(--tx)">${Math.max(0,Math.round(S.t.c-t.c))}g</b> carbs</div><div><b style="color:var(--tx)">${Math.max(0,Math.round(S.t.f-t.f))}g</b> fat</div></div></div>
 ${rec.length?`<div class="mu" style="margin:0 0 6px">Tap to log again</div><div class="pills">${rec.map(e=>`<button class="pill" onclick="again('${e.id}')">+ ${e.n}</button>`).join('')}</div>`:''}
 <div class="card"><h2>Log food</h2><div class="f"><label>Food or drink</label><input id="fn" placeholder="e.g. Chicken breast 150g"></div><div class="g3">${f('fk','kcal')}${f('fp','Protein g')}${f('fc','Carbs g')}</div><div class="g3" style="margin:10px 0">${f('ff','Fat g')}${f('fi','Fiber g')}${f('fw','Water ml')}</div><button class="btn" onclick="addFood()">Log food</button></div>
 <div class="card"><h2>Today <small>${L.length} items</small></h2>${L.length?L.map(e=>`<div class="li"><div><b>${e.n}</b><span class="mu">${hm(e.ts)} · ${Math.round(e.k)} kcal · ${r1(e.p)}P ${r1(e.c)}C ${r1(e.f)}F${e.w?` · ${e.w}ml`:''}</span></div><button class="x" onclick="del('food','${e.id}')">✕</button></div>`).join(''):'<div class="mu">Nothing logged yet. Add your first meal above.</div>'}</div>`},
train(){const e=EX[D.ex],k=est(),L=S.train.filter(isT).sort((a,b)=>b.ts-a.ts),st=(l,key,min,max,s)=>`<div><label>${l}</label><div class="step"><button onclick="st('${key}',-${s},${min},${max})">−</button><b>${D[key]}</b><button onclick="st('${key}',${s},${min},${max})">+</button></div></div>`;
 return `<div class="pills">${EX.map((x,i)=>`<button class="pill ${i==D.ex?'on':''}" onclick="pick(${i})">${x.n}</button>`).join('')}</div>
 <div class="card"><h2>${e.n} <small>${e.g}</small></h2><div class="mu" style="margin-bottom:12px">${e.cue}</div><div class="g2" style="margin-bottom:10px">${st('Sets','sets',1,10,1)}${st(e.time?'Minutes':'Reps','reps',1,60,1)}</div><div class="g2">${st('Effort (RPE)','rpe',5,10,.5)}${e.time?'<div></div>':st('Load kg','load',0,100,1)}</div></div>
 <div class="card" style="--c:#ffa51f"><div class="row"><div style="flex:1"><div class="num">${k}<span class="mu" style="font:600 15px 'Plus Jakarta Sans'"> kcal</span></div><div class="mu">${D.sets*D.reps} ${e.time?'min':'reps'}${e.time?'':` · ${D.sets*D.reps*D.load}kg total`}</div></div><button class="btn sm" onclick="addTrain()">Log set</button></div></div>
 <div class="card"><h2>Today <small>${burn()} kcal burned</small></h2>${L.length?L.map(x=>`<div class="li"><div><b>${x.n}</b><span class="mu">${x.s}×${x.reps} · RPE ${x.rpe} · ${x.k} kcal</span></div><button class="x" onclick="del('train','${x.id}')">✕</button></div>`).join(''):'<div class="mu">No sets yet. Pick an exercise and log your first set.</div>'}</div>`},
stacks(){const L=S.stacks.filter(x=>x.cat==SC),f=(id,l)=>`<div><label>${l}</label><input id="${id}" type="number" inputmode="decimal" placeholder="0"></div>`;
 return `<div class="pills">${['Morning','Afternoon','Evening'].map(c=>`<button class="pill ${c==SC?'on':''}" onclick="SC='${c}';go('stacks')">${c} (${S.stacks.filter(x=>x.cat==c).length})</button>`).join('')}</div>
 <div class="card">${L.length?L.map(x=>{const d=S.food.some(e=>isT(e)&&e.n==x.n);return `<div class="li"><div><b>${x.n}</b><span class="mu">${x.t} · ${x.k} kcal · ${x.p}P · ${x.w}ml</span></div><button class="add" onclick="logStack('${x.id}')" ${d?'style="opacity:.5"':''}>${d?'Logged ✓':'Log'}</button><button class="x" onclick="del('stacks','${x.id}')">✕</button></div>`}).join(''):`<div class="mu">No ${SC.toLowerCase()} stacks. Build one below.</div>`}</div>
 <div class="card"><h2>New ${SC.toLowerCase()} stack</h2><div class="g2 f"><div><label>Name</label><input id="sn" placeholder="Recovery stack"></div><div><label>Time</label><input id="stt" type="time" value="${SC=='Morning'?'07:30':SC=='Afternoon'?'13:00':'19:00'}"></div></div><div class="g3">${f('sk','kcal')}${f('sp','Protein g')}${f('sc','Carbs g')}</div><div class="g2" style="margin:10px 0">${f('sf','Fat g')}${f('sw','Water ml')}</div><button class="btn" onclick="addStack()">Save stack</button></div>`},
dose(){const q=S.vial,H=[...S.dose].sort((a,b)=>b.ts-a.ts),f=(id,l,k,t)=>`<div><label>${l}</label><input ${t?'':'type="number" inputmode="decimal"'} value="${q[k]}" oninput="vi('${k}',this.value${t?'':',1'})"></div>`,s=nextSite();
 return `<div class="card"><h2>Dose calculator</h2><div class="f">${f('', 'Compound','name',1)}</div><div class="g3 f">${f('','Vial mg','mg')}${f('','BAC water ml','bac')}${f('','Dose','dose')}</div><div class="g2 f"><div><label>Dose unit</label><select onchange="vi('unit',this.value);go()"><option ${q.unit=='mg'?'selected':''}>mg</option><option ${q.unit=='mcg'?'selected':''}>mcg</option></select></div><div><label>Syringe</label><select onchange="vi('syr',+this.value);go()">${[30,50,100].map(n=>`<option value="${n}" ${q.syr==n?'selected':''}>${n} units (${n/100}ml)</option>`).join('')}</select></div></div><div id="res">${dres()}</div></div>
 <div class="card" style="--c:#bd78ff"><div class="g2 f"><div><label>Injection site (next in rotation)</label><select id="site">${SITES.map(x=>`<option ${x==s?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Repeat every (days, 0 = none)</label><input id="wk" type="number" inputmode="numeric" value="${S.weekly.name==q.name?S.weekly.days:7}"></div></div><button class="btn" onclick="addDose()">Log dose now</button><div class="mu" style="margin-top:10px">Double-check the draw against your vial label and your prescriber’s instructions.</div></div>
 <div class="card"><h2>History <small>${H.length}</small></h2>${H.length?H.slice(0,12).map(d=>`<div class="li"><div><b>${d.n} · ${d.d}${d.unit}</b><span class="mu">Draw ${r1(d.u)}U · ${d.site} · ${new Date(d.ts).toLocaleDateString('en-CA',{month:'short',day:'numeric'})} ${hm(d.ts)}</span></div><button class="x" onclick="editDose('${d.id}')">✎</button><button class="x" onclick="del('dose','${d.id}')">✕</button></div>`).join(''):'<div class="mu">No doses logged yet.</div>'}</div>`}};
function calc(){const q=S.vial,conc=q.mg/q.bac,dm=q.unit=='mcg'?q.dose/1000:q.dose,ml=conc>0?dm/conc:0;return{conc,ml,u:ml*100,big:dm>q.mg}}
function dres(){const c=calc(),q=S.vial,ok=isFinite(c.u);return `<div class="mu">${ok?r1(c.conc):0} mg/ml</div><div class="num" style="color:var(--a)">Draw ${ok?r1(c.u):0} units <span class="mu" style="font:600 15px 'Plus Jakarta Sans'">${ok?(c.ml).toFixed(3):0} ml</span></div><div class="syr"><i style="width:${Math.min(100,c.u/q.syr*100)||0}%"></i></div><div class="mu" style="display:flex;justify-content:space-between"><span>0</span><span>${q.syr} units</span></div>${c.u>q.syr?'<div class="warn">This draw is bigger than your syringe. Use a larger syringe or less BAC water.</div>':''}${c.big?'<div class="warn">This dose is more than the whole vial.</div>':''}`}
function vi(k,v,n){S.vial[k]=n?(+v||0):v;save();const r=$('#res');if(r)r.innerHTML=dres()}
const est=()=>{const e=EX[D.ex];return Math.round(e.time?D.sets*D.reps*9*D.rpe/7.5:D.sets*D.reps*(D.load||5)*.1146*D.rpe/7.5)};
function pick(i){D.ex=i;D.load=EX[i].load||0;D.reps=EX[i].time?10:12;go('train')}
function st(k,d,mn,mx){D[k]=Math.min(mx,Math.max(mn,D[k]+d));go('train')}
function addTrain(){S.train.push({id:uid(),ts:nowT(),n:EX[D.ex].n,s:D.sets,reps:D.reps,rpe:D.rpe,k:est()});save();toast(`Logged ${est()} kcal`);go('train')}
function addFood(){const n=val('fn').trim();if(!n&&!num('fk')&&!num('fp')&&!num('fw'))return toast('Add a name or numbers');S.food.push({id:uid(),ts:nowT(),n:n||'Quick add',k:num('fk'),p:num('fp'),c:num('fc'),f:num('ff'),fi:num('fi'),w:num('fw')});save();toast('Food logged');go('fuel')}
function again(id){const e=S.food.find(x=>x.id==id);S.food.push({...e,id:uid(),ts:nowT()});save();toast('Logged '+e.n);go()}
function water(ml){S.food.push({id:uid(),ts:nowT(),n:'Water',k:0,p:0,c:0,f:0,fi:0,w:ml});save();toast(`+${ml}ml`);go()}
function logStack(id){const s=S.stacks.find(x=>x.id==id);S.food.push({id:uid(),ts:nowT(),n:s.n,k:s.k,p:s.p,c:s.c,f:s.f,fi:0,w:s.w});save();toast(s.n+' logged');go()}
function addStack(){const n=val('sn').trim();if(!n)return toast('Name your stack');S.stacks.push({id:uid(),n,cat:SC,t:val('stt'),k:num('sk'),p:num('sp'),c:num('sc'),f:num('sf'),w:num('sw')});save();toast('Stack saved');go('stacks')}
function addDose(){const q=S.vial,c=calc();if(!isFinite(c.u)||c.u<=0)return toast('Check the numbers');if(c.u>q.syr&&!confirm(`Draw is ${r1(c.u)}U but the syringe holds ${q.syr}U. Log anyway?`))return;const d=num('wk');S.dose.push({id:uid(),ts:nowT(),n:q.name,d:q.dose,unit:q.unit,u:c.u,site:val('site')});if(d>0)S.weekly={name:q.name,days:d};else if(S.weekly.name==q.name)S.weekly.days=0;save();toast('Dose logged');go('dose')}
function del(k,id){S[k]=S[k].filter(x=>x.id!=id);save();go()}
function sheet(){const s=$('#sh'),t=S.t,f=(i,l,v)=>`<div><label>${l}</label><input id="${i}" type="${i=='sname'?'text':'number'}" inputmode="decimal" value="${v}"></div>`;
 s.hidden=false;s.onclick=e=>{if(e.target==s)s.hidden=true};
 s.innerHTML=`<div><h2>Profile and targets</h2><div class="g2 f">${f('sname','Name',S.name)}${f('swt','Weight lb',S.wt)}</div><div class="g3 f">${f('tk','kcal',t.kcal)}${f('tp','Protein g',t.p)}${f('tc','Carbs g',t.c)}</div><div class="g3 f">${f('tf','Fat g',t.f)}${f('tfi','Fiber g',t.fi)}${f('tw','Water ml',t.w)}</div><button class="btn" onclick="saveSet()">Save</button><h2 style="margin-top:22px">Backup</h2><textarea id="bk" readonly>${JSON.stringify(S).replace(/</g,'&lt;')}</textarea><div class="row" style="margin-top:8px"><button class="btn ghost sm" onclick="$('#bk').select();document.execCommand('copy');toast('Copied')">Copy</button><button class="btn ghost sm" onclick="imp()">Paste to import</button></div></div>`}
function saveSet(){S.name=val('sname')||'Athlete';S.wt=num('swt');S.t={kcal:num('tk'),p:num('tp'),c:num('tc'),f:num('tf'),fi:num('tfi'),w:num('tw')};save();$('#sh').hidden=true;go()}
function imp(){const j=prompt('Paste your backup JSON');if(!j)return;try{S=Object.assign({},DEF,JSON.parse(j));save();$('#sh').hidden=true;go();toast('Imported')}catch(e){toast('That JSON isn’t valid')}}
const TABS=[['today','Today','M3 11l9-8 9 8M5 10v10h14V10'],['fuel','Fuel','M7 3v7a2 2 0 002 2v9M11 3v7M15 3c-2 2-2 7 0 9v9'],['train','Train','M3 9v6M7 6v12M17 6v12M21 9v6M7 12h10'],['stacks','Stacks','M12 3l9 5-9 5-9-5zM3 13l9 5 9-5'],['dose','Dose','M14 4l6 6M12 6l6 6-8 8H4v-6zM4 20l3-3']];
function go(t){if(t&&location.hash!='#'+t){location.hash=t;return}const h=location.hash.slice(1);tab=TABS.some(x=>x[0]==h)?h:'today';document.body.dataset.tab=tab;
 $('#hn').textContent=`${S.name} · ${S.wt} lb`;$('#nv').innerHTML=TABS.map(x=>`<a href="#${x[0]}" class="${x[0]==tab?'on':''}"><svg viewBox="0 0 24 24"><path d="${x[2]}"/></svg>${x[1]}</a>`).join('');$('#v').innerHTML=V[tab]()}

const APPS_SCRIPT = `function doGet(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName("State") || ss.insertSheet("State");
  var raw = sheet.getRange("A1").getValue();
  var data = {};

}

function doPost(e) {
  try {
    var payload = JSON.parse(e.postData.contents);
    var state = payload.state || payload;
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var stateSheet = ss.getSheetByName("State") || ss.insertSheet("State");
    stateSheet.getRange("A1").setValue(JSON.stringify(state));
    if (state.food && state.food.length) {
      var foodSheet = ss.getSheetByName("Food Log") || ss.insertSheet("Food Log");
      foodSheet.clearContents();
      foodSheet.appendRow(["Date", "Time", "Item", "Calories", "Protein (g)", "Carbs (g)", "Fat (g)", "Fiber (g)", "Water (ml)"]);
      state.food.slice().sort(function(a,b){ return b.ts - a.ts; }).forEach(function(f) {
        var d = new Date(f.ts);
        foodSheet.appendRow([d.toLocaleDateString(), d.toLocaleTimeString(), f.n||"", f.k||0, f.p||0, f.c||0, f.f||0, f.fi||0, f.w||0]);
      });
    }
    if (state.train && state.train.length) {
      var trainSheet = ss.getSheetByName("Training") || ss.insertSheet("Training");
      trainSheet.clearContents();
      trainSheet.appendRow(["Date", "Time", "Exercise", "Sets", "Reps/Duration", "RPE", "Burn (kcal)"]);
      state.train.slice().sort(function(a,b){ return b.ts - a.ts; }).forEach(function(t) {
        var d = new Date(t.ts);
        trainSheet.appendRow([d.toLocaleDateString(), d.toLocaleTimeString(), t.n||"", t.s||0, (t.reps||0)+(t.u?" "+t.u:""), t.rpe||0, t.k||0]);
      });
    }
    if (state.dose && state.dose.length) {
      var doseSheet = ss.getSheetByName("Doses") || ss.insertSheet("Doses");
      doseSheet.clearContents();
      doseSheet.appendRow(["Date", "Time", "Compound", "Dose", "Unit", "Draw Units", "Site", "Stack"]);
      state.dose.slice().sort(function(a,b){ return b.ts - a.ts; }).forEach(function(ds) {
        var d = new Date(ds.ts);
        doseSheet.appendRow([d.toLocaleDateString(), d.toLocaleTimeString(), ds.n||"", ds.d||0, ds.unit||"", ds.u?Number(ds.u).toFixed(1):0, ds.site||"", ds.stack||""]);
      });
    }
    return ContentService.createTextOutput(JSON.stringify({ success: true, timestamp: new Date().toISOString() }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    return ContentService.createTextOutput(JSON.stringify({ success: false, error: err.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}`;

async function pushCloud(silent){
  if(!S.syncUrl) return;
  const cld=$('#cld');
  if(cld) cld.textContent='🔄';
  try{
    const r=await fetch('/api/sync',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url:S.syncUrl,state:S})
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    S.lastSync=Date.now();
    try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
    if(!silent) toast('Synced to Google Sheets ✓');
    if(cld) cld.textContent='☁️';
    const ss=$('#syncStatus');
    if(ss) ss.textContent='Synced at '+new Date().toLocaleTimeString();
  }catch(err){
    if(cld) cld.textContent='⚠️';
    if(!silent) toast('Sync failed: '+err.message);
  }
}

async function pullCloud(manual){
  if(!S.syncUrl){
    if(manual) toast('Set your Google Apps Script URL first');
    return;
  }
  const cld=$('#cld');
  if(cld) cld.textContent='🔄';
  if(manual) toast('Pulling from Google Sheets…',3000);
  try{
    const r=await fetch('/api/sync?url='+encodeURIComponent(S.syncUrl));
    if(!r.ok) throw new Error('HTTP '+r.status);
    const res=await r.json();
    const cloud=res.data;
    if(cloud && typeof cloud==='object' && (cloud.food || cloud.train || cloud.dose || cloud.stacks)){
      const mergeArr=(local,remote)=>{
        const map=new Map();
        (local||[]).forEach(x=>map.set(x.id,x));
        (remote||[]).forEach(x=>map.set(x.id,x));
        return Array.from(map.values());
      };
      S.food=mergeArr(S.food,cloud.food);
      S.train=mergeArr(S.train,cloud.train);
      S.dose=mergeArr(S.dose,cloud.dose);
      S.stacks=mergeArr(S.stacks,cloud.stacks);
      S.favs=mergeArr(S.favs,cloud.favs);
      if(cloud.t) S.t=Object.assign({},S.t,cloud.t);
      if(cloud.pr) S.pr=Object.assign({},S.pr,cloud.pr);
      if(cloud.wt) S.wt=cloud.wt;
      if(cloud.name) S.name=cloud.name;
      S.lastSync=Date.now();
      try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
      if(cld) cld.textContent='☁️';
      toast(manual?'Updated from Google Sheets ✓':'Synced with cloud ✓');
      go();
    } else if(manual){
      toast('Sheet is currently empty. Syncing this device up…');
      pushCloud(false);
    }
  }catch(err){
    if(cld) cld.textContent='⚠️';
    if(manual) toast('Pull failed: '+err.message);
  }
}

  const url=(val('ssync')||'').trim();

function scaleUsdaEntry(entry,grams){
 const f=grams/100,mi={},am={};
 for(const k in entry.mi)mi[k]=r1(entry.mi[k]*f);
 for(const k in entry.am)am[k]=r1(entry.am[k]*f);
 return {
  n:`${entry.n} (${grams}${entry.w>=90?'ml':'g'})`,
  k:r1(entry.k*f),
  p:r1(entry.p*f),
  c:r1(entry.c*f),
  f:r1(entry.f*f),
  fi:r1(entry.fi*f),
  w:entry.w>=90?Math.round(grams*(entry.w/100)):0,
  mi,am
 };
}

function parsePortion(d,entry){
 const s=String(d||'').toLowerCase();
 const m=s.match(/(\d+(?:\.\d+)?)\s*(grams?|g|oz|ounces?|kg|lb|ml|l|cups?|tbsp|tablespoons?|tsp|teaspoons?|scoops?|packets?)\b/i);
 if(m){
  const v=+m[1]||1,u=m[2].toLowerCase();
  if(u.startsWith('o'))return Math.round(v*28.35);
  if(u=='kg'||u=='l')return Math.round(v*1000);
  if(u=='lb')return Math.round(v*453.6);
  if(u.startsWith('cup'))return Math.round(v*(entry&&entry.w>=90?240:200));
  if(u.startsWith('tbsp')||u.startsWith('tablespoon'))return Math.round(v*14);
  if(u.startsWith('tsp')||u.startsWith('teaspoon'))return Math.round(v*5);
  if(u.startsWith('scoop'))return Math.round(v*30);
  if(u.startsWith('packet'))return Math.round(v*6);
  return Math.round(v);
 }
 if(entry&&entry.unitG){
  const cm=s.match(/^(\d+(?:\.\d+)?)\s+/);
  if(cm)return Math.round((+cm[1]||1)*entry.unitG);
 }
 return entry?entry.defG:100;
}

 p=+p||0;if(p<=0)return {};

}

function offMicro(nut,k,unit,factor){
 const r100=nut[k+'_100g'],rSrv=nut[k+'_serving'],u=(nut[k+'_unit']||'g').toLowerCase();
 let gVal=r100!==undefined&&r100!==null&&r100!==''?+r100*factor:rSrv!==undefined&&rSrv!==null&&rSrv!==''?+rSrv:0;
 if(!isFinite(gVal)||gVal<=0)return 0;
 if(unit=='mg')return r1(u=='g'||gVal<10?gVal*1000:gVal);
 if(unit=='mcg')return r1(u=='g'||gVal<0.1?gVal*1e6:u=='mg'||gVal<10?gVal*1000:gVal);
 return r1(gVal);
}

async function lookupUPC(rawCode){

  if(VERIFIED_UPCS[k])return VERIFIED_UPCS[k]();

  const r=await fetch(`/api/food?upc=${encodeURIComponent(c)}${S.fdc?'&key='+encodeURIComponent(S.fdc):''}`);

   const d=await r.json();
   if(d&&d.n&&(d.k||d.p||d.c||d.f))return d;
  }

     const kcal=Math.round((useSrv&&nut['energy-kcal_serving']!==undefined?+nut['energy-kcal_serving']:(+nut['energy-kcal_100g']||0)*factor)||(p*4+cb*4+f*9));

      Ka:offMicro(nut,'potassium','mg',factor),Zn:offMicro(nut,'zinc','mg',factor),

const _ai=aiFood;
